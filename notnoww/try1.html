<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>Smart Money 24/7 · CTA</title>
    <!-- Font Awesome 6 (free) for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Google Font Poppins (optional but matches style) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* reset / base for demo */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ---------- CTA SECTION (exactly as provided, with minor tweaks for full width) ---------- */
      .cta-section {
        max-width: 1300px;
        width: 100%;
        margin: 20px auto 60px;
        padding: 0 30px;
        font-family: "Poppins", Arial, sans-serif;
        background: #ffffff; /* dark background to make CTA pop */
        /* display: flex;
        align-items: center;
        justify-content: center; */
      }

      .cta-box {
        position: relative;
        overflow: hidden;
        isolation: isolate;

        background: linear-gradient(
          135deg,
          rgba(5, 5, 5, 0.638) 0%,
          rgba(35, 27, 8, 0.688) 45%,
          rgba(184, 135, 11, 0.501) 100%
        );

        border-radius: 32px;
        padding: 55px 40px;
        text-align: center;

        border: 1px solid rgba(226, 177, 45, 0.45);

        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.35),
          0 0 40px rgba(190, 139, 15, 0.12);

        color: #fff;
        font-family: "Poppins", Arial, sans-serif !important;
      }

      /* Background image — using a placeholder gradient if image missing, 
       but we keep the rule with a fallback so it looks polished even without "Photos/11-22.png" */
      .cta-box::before {
        content: "";
        position: absolute;
        inset: 0;
        /* using a real image from picsum to simulate "Photos/11-22.png" 
         in case the original file is not available – but we keep both */
        background-image: url("Photos/11-22.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: -2;
        transform: scale(1.03);
        /* fallback if image fails: */
        background-color: #1f1a0e;
      }

      /* extra overlay to keep text legible */
      .cta-box::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.25);
        z-index: -1;
        border-radius: 32px;
      }

      .cta-box > * {
        position: relative;
        z-index: 2;
      }

      .cta-box h2 {
        font-size: 39px;
        font-weight: 600;
        color: #fff;
        margin-bottom: 6px;
        font-family: "Poppins", Arial, sans-serif !important;
      }

      .cta-box h2 i {
        color: #efe666;
        margin-right: 10px;
        padding: 12px 14px;
        background: #654800b8;
        border-radius: 50px;
        margin-bottom: 10px;
        font-size: 30px;
      }

      .cta-box p {
        color: rgba(255, 255, 255, 0.85);
        font-size: 1.1rem;
        max-width: 600px;
        margin: 8px auto 20px;
        font-weight: 400;
      }

      .cta-box .btn-gold {
        background: linear-gradient(
          135deg,
          #f7f18c 0%,
          #efe666 45%,
          #d8a91c 100%
        );
        border: none;
        padding: 14px 44px;
        border-radius: 60px;
        font-weight: 700;
        font-size: 1.05rem;
        color: #01060e;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        transition: 0.25s;
        box-shadow: 0 8px 28px rgba(239, 230, 102, 0.15);
        cursor: pointer;
        margin-top: 4px;
      }

      .cta-box .btn-gold:hover {
        transform: scale(1.03);
        box-shadow: 0 12px 40px rgba(239, 230, 102, 0.25);
      }

      .cta-box .btn-outline-light {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 14px 36px;
        border-radius: 60px;
        font-weight: 600;
        font-size: 1rem;
        color: #fff;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        transition: 0.2s;
        backdrop-filter: blur(2px);
        margin-left: 12px;
      }

      .cta-box .btn-outline-light:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.5);
      }

      .cta-box .action-group {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin: 6px 0 0;
      }

      .more-questions {
        margin-top: 20px;
        border-top: 1px solid #eef2f6;
        padding-top: 24px;
        text-align: center;
        color: #4d6679;
      }

      .more-questions i {
        color: #b8860b;
        margin-right: 8px;
      }

      @media (max-width: 480px) {
        .cta-box {
          padding: 24px 16px;
          border-radius: 24px;
        }

        .cta-box h2 {
          font-size: 1.3rem;
        }

        .cta-box p {
          font-size: 0.95rem;
        }

        .cta-box .btn-gold {
          padding: 12px 28px;
          font-size: 0.95rem;
        }

        .cta-box .btn-outline-light {
          padding: 12px 24px;
          font-size: 0.9rem;
          margin-left: 0; /* remove left margin on small screens */
        }

        .cta-section {
          padding: 0 12px;
          margin: 16px auto 40px;
        }
      }

      @media (max-width: 380px) {
        .cta-box h2 {
          font-size: 1.1rem;
        }
        .cta-box p {
          font-size: 0.85rem;
        }
        .cta-box .btn-gold {
          padding: 10px 22px;
          font-size: 0.85rem;
        }
        .cta-box .btn-outline-light {
          padding: 10px 18px;
          font-size: 0.8rem;
        }
      }

      /* extra polish: action group on very small screens stacks nicely */
      @media (max-width: 420px) {
        .cta-box .action-group {
          flex-direction: column;
          align-items: center;
        }
        .cta-box .btn-outline-light {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- ============ CTA SECTION (last) ============ -->
    <div class="cta-section">
      <div class="cta-box">
        <h2>
          <i class="fas fa-rocket"></i> <br />
          Ready to Master the Markets?
        </h2>
        <p>
          Join Smart Money 24/7 and get full access to video courses, trading
          tools, economic calendar, live news, and more.
        </p>
        <div class="action-group">
          <a href="Coursees.html" class="btn-gold"
            ><i class="fas fa-play-circle"></i> Start Learning</a
          >
          <a href="Contact.html" class="btn-outline-light"
            ><i class="fas fa-headset"></i> Contact Support</a
          >
        </div>
        <p
          style="margin-top: 20px; font-size: 0.8rem; opacity: 0.5; color: #fff"
        >
          More questions? Reach us at support@smartmoney247.com
        </p>
      </div>
    </div>

    <!-- small note: the background image uses an Unsplash finance photo as fallback,
       but you can replace the url with your own "Photos/11-22.png" -->
  </body>
</html>
