<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Kirti Realty | Luxury Contact</title>
    <!-- Google Fonts: Elegant Serif + Clean Sans -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome 6 (Free Icons - pure vector icons, no emojis) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #ffffff;
        font-family: "Montserrat", sans-serif;
        color: #1e1e2a;
        line-height: 1.5;
      }

      /* ----- FULL WIDTH LUXURY HEADER (white bg context, but header has bg image + animation) ----- */
      .luxury-header {
        width: 100%;
        min-height: 280px;
        position: relative;
        overflow: hidden;
        background-color: #faf9f7;
      }

      /* Background image layer with gentle zoom animation (premium feel) */
      .header-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("Images/KR-4.png");
        background-size: cover;
        background-position: center 35%;
        background-repeat: no-repeat;
        z-index: 0;
        will-change: transform;
        animation: premiumZoom 12s ease-in-out infinite alternate;
        transform-origin: center center;
      }

      /* Elegant overlay: soft white-to-dark gradient for text contrast */
      .luxury-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          115deg,
          rgba(0, 0, 0, 0.55) 0%,
          rgba(0, 0, 0, 0.4) 45%,
          rgba(0, 0, 0, 0.5) 100%
        );
        z-index: 1;
      }

      /* Gold shimmer line at bottom of header */
      .luxury-header::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          #c9a03d,
          #f2c94c,
          #c9a03d,
          transparent
        );
        z-index: 3;
        box-shadow: 0 0 5px rgba(210, 175, 70, 0.5);
      }

      /* Content wrapper (text + heading) */
      .header-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100%;
        min-height: 380px;
        padding: 2rem 1.5rem;
      }

      .contact-heading {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2.6rem, 8vw, 4.6rem);
        font-weight: 600;
        letter-spacing: 0.01em;
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #f5e7d3 40%,
          #ff9a00 100%
        );
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin-bottom: 0.6rem;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
        animation: fadeUp 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
      }

      .luxury-sub {
        font-size: clamp(0.75rem, 3vw, 0.95rem);
        font-weight: 500;
        letter-spacing: 0.2rem;
        text-transform: uppercase;
        color: #e5d5b0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(6px);
        display: inline-block;
        padding: 0.45rem 1.6rem;
        border-radius: 50px;
        border: 0.5px solid rgba(220, 190, 110, 0.5);
        animation: fadeUp 0.7s 0.1s forwards;
        opacity: 0;
        transform: translateY(18px);
        animation-fill-mode: forwards;
      }

      @keyframes premiumZoom {
        0% {
          transform: scale(1);
          background-position: center 35%;
        }
        100% {
          transform: scale(1.06);
          background-position: center 33%;
        }
      }

      @keyframes fadeUp {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ----- BUSINESS INFO SECTION: WHITE BACKGROUND, SMALL BUT PREMIUM CARDS ----- */
      .business-section {
        background: #ffffff;
        padding: 2.5rem 1.5rem 2.5rem;
        width: 100%;
      }

      .info-grid {
        max-width: 1250px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: stretch;
        gap: 1.2rem;
      }

      /* Premium small cards — elegant, minimal, elevated */
      .premium-card {
        background: #ffffff;
        border-radius: 20px;
        padding: 1.2rem 1rem;
        flex: 1;
        min-width: 270px;
        max-width: 210px;
        transition: all 0.3s ease;
        border: 1px solid #f0eade;
        box-shadow:
          0 6px 14px rgba(0, 0, 0, 0.02),
          0 2px 4px rgba(0, 0, 0, 0.02);
        text-align: center;
        backdrop-filter: blur(0px);
      }

      /* Slight hover for luxury touch */
      .premium-card:hover {
        transform: translateY(-3px);
        border-color: #e2cfaa;
        box-shadow:
          0 18px 28px -12px rgba(0, 0, 0, 0.08),
          0 0 0 1px rgba(200, 170, 90, 0.2);
        background: #fefcf9;
      }

      /* Icon styling: gold-ish, refined */
      .premium-card .info-icon {
        font-size: 1.7rem;
        color: #c5850d;
        margin-bottom: 0.65rem;
        display: inline-block;
        transition: color 0.2s;
      }

      .premium-card:hover .info-icon {
        color: #c9a13b;
      }

      .info-label {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
        color: #9a8a6b;
        margin-bottom: 10px;
      }

      .info-value {
        font-size: 0.85rem;
        font-weight: 600;
        color: #252525;
        word-break: break-word;
        line-height: 1.35;
        font-family: "Montserrat", sans-serif;
      }

      /* specific for company name emphasis */
      .company-name {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.2px;
        background: linear-gradient(120deg, #2a241a, #5a4a2e);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }

      .address-text {
        font-size: 14px;
        font-weight: 500;
        color: #4a3f2f;
        line-height: 1.4;
      }

      .premium-card .contact-link {
        text-decoration: none;
        color: #2c2b26;
        font-weight: 600;
        transition: color 0.2s;
        font-size: 17px;
      }

      .premium-card .contact-link:hover {
        color: #bb9a5c;
      }

      /* small gold accent divider within card (optional) */
      .card-divider {
        width: 24px;
        height: 1px;
        background: #e2cfaa;
        margin: 0.6rem auto 0.4rem;
      }

      /* responsiveness: make cards smaller on mobile but still premium */
      @media (max-width: 780px) {
        .info-grid {
          gap: 1rem;
        }
        .premium-card {
          min-width: 160px;
          max-width: 180px;
          padding: 1rem 0.8rem;
        }
        .info-value {
          font-size: 0.75rem;
        }
        .company-name {
          font-size: 0.9rem;
        }
        .address-text {
          font-size: 0.7rem;
        }
        .premium-card .info-icon {
          font-size: 1.5rem;
        }
      }

      @media (max-width: 620px) {
        .info-grid {
          justify-content: center;
        }
        .premium-card {
          min-width: 150px;
          max-width: 165px;
        }
      }

      @media (max-width: 540px) {
        .premium-card {
          flex-basis: calc(50% - 1rem);
          max-width: none;
          min-width: 140px;
        }
        .business-section {
          padding: 1.8rem 1rem;
        }
      }

      /* extra luxury divider line */
      .elegant-separator {
        width: 45px;
        height: 2px;
        background: #dfca9c;
        margin: 1.5rem auto 0;
        opacity: 0.6;
      }

      /* subtle brand quote */
      .brand-note {
        text-align: center;
        margin-top: 2rem;
        font-size: 0.7rem;
        color: #a49171;
        letter-spacing: 0.8px;
        font-weight: 400;
      }

      .fa-gem,
      .fa-building,
      .fa-mobile-alt,
      .fa-envelope,
      .fa-map-marker-alt {
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.05));
      }
    </style>
  </head>
