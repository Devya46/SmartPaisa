<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>responsive · logo left · hamburger right</title>
    <!-- Font Awesome 6 (free) for hamburger & icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      .body-header {
        background: #f2f5f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ----- main header: round & sticky ----- */
      .round-header {
        position: sticky;
        top: 16px;
        z-index: 999;
        width: 100%;
        padding: 0 24px;
        margin: 0 auto;
        pointer-events: none; /* let clicks pass to inner */
      }
      .round-header * {
        pointer-events: auto;
      }

      .header-inner {
        max-width: 1280px;
        margin: 0 auto;
        background: #0a1a3a; /* dark navy blue */
        border-radius: 80px; /* pill / round shape */
        padding: 1px 28px;
        box-shadow: 0 12px 30px rgba(10, 26, 58, 0.25);
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.2s ease;
        backdrop-filter: blur(2px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        min-height: 72px;
        position: relative;
        overflow: visible; /* logo can overflow */
      }

      /* ----- left side: logo image (always left) ----- */
      .header-left {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }

      .logo-image {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 70px;
        width: auto;
        flex-shrink: 0;
        overflow: visible;
        position: relative;
        z-index: 5;
      }

      .logo-image img {
        display: block;
        height: 100%;
        width: auto;
        max-height: 90px; /* bigger than header → overflows */
        object-fit: contain;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        transition: 0.2s;
        image-rendering: auto;
      }

      /* ----- right side: hamburger (always right) + desktop nav/buttons hidden on mobile ----- */
      .header-right {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-shrink: 0;
      }

      /* hamburger – visible on all screens, but we hide it on desktop via display: none
       and show it only on small screens. But we want it always on the right.
       we keep it always in DOM, but visible only on mobile */
      .hamburger {
        display: none; /* hidden by default on desktop */
        background: transparent;
        border: none;
        color: white;
        font-size: 2rem;
        cursor: pointer;
        padding: 4px 6px;
        transition: 0.2s;
        line-height: 1;
        order: 2; /* ensure it's after any other right items if needed */
      }

      .hamburger:hover {
        opacity: 0.8;
        transform: scale(0.96);
      }

      /* ----- desktop navigation (hidden on mobile) ----- */
      .nav-links {
        display: flex;
        align-items: center;
        gap: 10px 22px;
        flex-wrap: wrap;
        list-style: none;
      }

      .nav-links a {
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        font-weight: 500;
        font-size: 1rem;
        letter-spacing: 0.01em;
        transition: 0.2s;
        padding: 6px 4px;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }

      .nav-links a:hover {
        color: white;
        border-bottom-color: #7aa9ff;
      }

      /* ----- desktop buttons (hidden on mobile) ----- */
      .btn-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .btn-outline,
      .btn-solid {
        padding: 8px 20px;
        border-radius: 60px;
        font-weight: 600;
        font-size: 0.95rem;
        border: none;
        cursor: pointer;
        transition: 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }

      .btn-outline {
        background: transparent;
        color: white;
        border: 1.5px solid rgba(255, 255, 255, 0.35);
      }

      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.7);
      }

      .btn-solid {
        background: white;
        color: #0a1a3a;
        box-shadow: 0 4px 10px rgba(0, 20, 50, 0.2);
      }

      .btn-solid:hover {
        background: #eef4ff;
        transform: scale(0.97);
      }

      /* ----- mobile nav dropdown (hidden by default) ----- */
      .mobile-nav {
        display: none;
        flex-direction: column;
        background: #0a1a3a;
        padding: 24px 28px 28px;
        border-radius: 40px;
        margin-top: 14px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.06);
        width: 100%;
      }

      .mobile-nav.open {
        display: flex;
      }

      .mobile-nav a {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: none;
        font-size: 1.2rem;
        font-weight: 500;
        padding: 14px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        transition: 0.15s;
      }

      .mobile-nav a:last-of-type {
        border-bottom: none;
      }

      .mobile-nav a:hover {
        color: white;
        padding-left: 10px;
      }

      .mobile-btns {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 18px;
      }

      .mobile-btns .btn-outline,
      .mobile-btns .btn-solid {
        width: 100%;
        justify-content: center;
        padding: 14px;
        font-size: 1.1rem;
      }

      .mobile-btns .btn-outline {
        border-color: rgba(255, 255, 255, 0.25);
      }

      /* ----- RESPONSIVE: on smaller screens, show hamburger, hide nav & buttons ----- */
      @media screen and (max-width: 880px) {
        .header-inner {
          border-radius: 60px;
          padding: 10px 20px;
          min-height: 66px;
        }

        /* hide desktop nav & buttons */
        .nav-links {
          display: none;
        }
        .btn-group {
          display: none;
        }

        /* show hamburger on the right */
        .hamburger {
          display: block;
        }

        /* ensure header-right keeps hamburger on the right */
        .header-right {
          gap: 8px;
        }

        .logo-image {
          height: 60px;
        }
        .logo-image img {
          max-height: 76px;
        }
      }

      /* extra small screens */
      @media screen and (max-width: 480px) {
        .round-header {
          padding: 0 12px;
          top: 12px;
        }
        .header-inner {
          padding: 8px 14px;
          border-radius: 50px;
          min-height: 60px;
        }
        .logo-image {
          height: 52px;
        }
        .logo-image img {
          max-height: 68px;
        }
        .hamburger {
          font-size: 1.7rem;
        }
        .mobile-nav a {
          font-size: 1.1rem;
          padding: 12px 4px;
        }
      }

      /* ----- demo page content ----- */
      .page-content {
        flex: 1;
        max-width: 1200px;
        margin: 40px auto 60px;
        padding: 0 28px;
        color: #1e2b44;
      }

      .page-content h1 {
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 16px;
        color: #0a1a3a;
      }

      .page-content p {
        font-size: 1.1rem;
        line-height: 1.7;
        color: #2c3e5a;
        max-width: 680px;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 32px;
      }

      .card {
        background: white;
        border-radius: 24px;
        padding: 20px 18px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.02);
        border: 1px solid rgba(10, 26, 58, 0.06);
      }

      .card h3 {
        color: #0a1a3a;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .card p {
        font-size: 0.95rem;
        color: #3f5170;
      }

      .footer-note {
        margin-top: 50px;
        border-top: 1px solid #dce3ed;
        padding-top: 28px;
        color: #4a5c78;
      }

      .overflow-demo {
        background: rgba(122, 169, 255, 0.08);
        border-radius: 60px;
        padding: 6px 18px;
        display: inline-block;
        font-size: 0.9rem;
        color: #1f4f8a;
        margin-top: 8px;
      }

      /* ensure right side stays right */
      .header-right {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div class="body-header">
      <!-- ROUND STICKY HEADER: logo left, hamburger right (on mobile) -->
      <header class="round-header">
        <div class="header-inner">
          <!-- LEFT: logo image (always left) -->
          <div class="header-left">
            <div class="logo-image">
              <img
                src="Photos/SMART MONEY LOGO 01 (1).png"
                alt="EduFlow logo"
                title="EduFlow – logo overflows header"
              />
            </div>
          </div>

          <!-- RIGHT: desktop nav + buttons (hidden on mobile) + hamburger (visible on mobile) -->
          <div class="header-right">
            <!-- desktop navigation -->
            <ul class="nav-links">
              <li><a href="#">Courses</a></li>
              <li><a href="#">Webinars</a></li>
              <li><a href="#">Calculator</a></li>
              <li><a href="#">News</a></li>
              <li><a href="#">Pricing</a></li>
              <li><a href="#">About</a></li>
            </ul>

            <!-- desktop buttons -->
            <div class="btn-group">
              <a href="#" class="btn-outline"
                ><i class="fas fa-user" style="margin-right: 8px"></i>Log In</a
              >
              <a href="#" class="btn-solid">Sign Up</a>
            </div>

            <!-- HAMBURGER – always on the right, visible only on mobile -->
            <button
              class="hamburger"
              id="hamburgerBtn"
              aria-label="Toggle navigation menu"
            >
              <i class="fas fa-bars"></i>
            </button>
          </div>
        </div>

        <!-- mobile dropdown (hidden by default) -->
        <div class="mobile-nav" id="mobileNav">
          <li><a href="#">Courses</a></li>
          <li><a href="#">Webinars</a></li>
          <li><a href="#">Calculator</a></li>
          <li><a href="#">News</a></li>
          <li><a href="#">Pricing</a></li>
          <li><a href="#">About</a></li>
          <div class="mobile-btns">
            <a href="#" class="btn-outline"
              ><i class="fas fa-user" style="margin-right: 8px"></i>Log In</a
            >
            <a href="#" class="btn-solid">Sign Up</a>
          </div>
        </div>
      </header>
    </div>

    <script>
      (function () {
        const hamburger = document.getElementById("hamburgerBtn");
        const mobileNav = document.getElementById("mobileNav");

        function toggleMobileNav() {
          const isOpen = mobileNav.classList.toggle("open");
          const icon = hamburger.querySelector("i");
          if (isOpen) {
            icon.className = "fas fa-times";
          } else {
            icon.className = "fas fa-bars";
          }
        }

        hamburger.addEventListener("click", function (e) {
          e.stopPropagation();
          toggleMobileNav();
        });

        // close mobile nav when clicking outside
        document.addEventListener("click", function (e) {
          const header = document.querySelector(".round-header");
          if (
            !header.contains(e.target) &&
            mobileNav.classList.contains("open")
          ) {
            mobileNav.classList.remove("open");
            const icon = hamburger.querySelector("i");
            icon.className = "fas fa-bars";
          }
        });

        // close mobile nav when a link is clicked
        const mobileLinks = mobileNav.querySelectorAll("a");
        mobileLinks.forEach((link) => {
          link.addEventListener("click", function () {
            if (mobileNav.classList.contains("open")) {
              mobileNav.classList.remove("open");
              const icon = hamburger.querySelector("i");
              icon.className = "fas fa-bars";
            }
          });
        });

        // handle resize: if screen becomes wider than 880px, close mobile nav
        window.addEventListener("resize", function () {
          if (window.innerWidth > 880) {
            if (mobileNav.classList.contains("open")) {
              mobileNav.classList.remove("open");
              const icon = hamburger.querySelector("i");
              icon.className = "fas fa-bars";
            }
          }
        });
      })();
    </script>
  </body>
</html>
