<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Money 24/7 · Premium CTA</title>
    <!-- Font Awesome 6 (Free) for icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      /* ==========================
       SMART MONEY 24/7 · PREMIUM & PROFESSIONAL
       Dark navy + gold + glassmorphism button
    ========================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .body-cta {
        background: #010101;
        display: flex;
        justify-content: center;
        align-items: center;
        /* min-height: 100vh; */
        padding: 30px 16px;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          sans-serif;
      }

      /* ----- CARD / SECTION – Premium dark blue & gold ----- */
      .cta-premium {
        max-width: 1200px;
        width: 100%;
        border-radius: 40px;
        padding: 50px 90px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 40px;
        min-height: 190px;
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(255, 215, 120, 0.08);

        /* Background Image – same premium visual */
        background-image: url("https://financewithajay.co/wp-content/uploads/2026/07/CTA.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-color: #0a1a2f; /* fallback */
      }

      /* Overlay – richer, deeper, with gold glow */
      .cta-premium::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 25%,
            rgba(30, 70, 130, 0.75) 0%,
            transparent 60%
          ),
          radial-gradient(
            circle at 85% 75%,
            rgba(227, 184, 92, 0.2) 0%,
            transparent 50%
          ),
          linear-gradient(135deg, #08141f 0%, #0f2844 60%, #1a3a62 100%);
        border-radius: 40px;
        z-index: 1;
        opacity: 0.94;
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }

      .cta-content,
      .cta-button-wrapper {
        position: relative;
        z-index: 2;
      }

      /* ----- TEXT – refined, professional, luminous ----- */
      .cta-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .cta-title {
        font-size: 40px;
        font-weight: 400;
        color: #ffffff;
        line-height: 1.2;
        letter-spacing: -0.02em;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }

      .cta-title .highlight-gold {
        background: linear-gradient(145deg, #f7b32b, #d99f1a);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 500;
        text-shadow: 0 0 30px rgb(227 184 92 / 10%);
      }

      .cta-sub {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.92);
        font-weight: 400;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
        letter-spacing: 0.01em;
        max-width: 620px;
        line-height: 1.5;
        margin-top: 2px;
        opacity: 0.95;
      }

      /* ----- PREMIUM BUTTON (glass + gradient hover) ----- */
      .premiumbtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px 38px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 60px;
        color: #ffffff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1.6px;
        text-transform: uppercase;
        transition: all 0.35s ease;
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        align-self: flex-start;
        gap: 14px;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        white-space: nowrap;
      }

      .premiumbtn i {
        font-size: 1.25rem;
        color: rgba(255, 255, 255, 0.8);
        transition: color 0.3s ease;
      }

      /* pseudo-element – animated blue gradient sweep */
      .premiumbtn::before {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, #1a5bbf, #3f93ff, #5bbcff);
        transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        z-index: -1;
        border-radius: 60px;
      }

      .premiumbtn:hover {
        border-color: #5bbcff;
        box-shadow:
          0 0 45px rgba(20, 135, 255, 0.3),
          0 8px 30px rgba(0, 0, 0, 0.5);
        transform: translateY(-3px);
        color: #ffffff;
      }

      .premiumbtn:hover::before {
        transform: translateX(0);
      }

      .premiumbtn:hover i {
        color: #ffffff;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
      }

      .premiumbtn:active {
        transform: scale(0.96);
        transition-duration: 0.1s;
      }

      /* ----- RESPONSIVE ----- */
      @media (max-width: 860px) {
        .cta-premium {
          flex-direction: column;
          text-align: center;
          padding: 38px 32px;
          gap: 24px;
          min-height: 220px;
          border-radius: 32px;
        }

        .cta-title {
          font-size: 2rem;
        }

        .cta-sub {
          font-size: 1rem;
          max-width: 100%;
          margin-left: auto;
          margin-right: auto;
        }

        .premiumbtn {
          align-self: center;
          padding: 14px 32px;
          white-space: normal;
          font-size: 12px;
          letter-spacing: 1.4px;
          width: auto;
          min-width: 200px;
          justify-content: center;
        }

        .premiumbtn i {
          font-size: 1.1rem;
        }
      }

      @media (max-width: 500px) {
        .cta-premium {
          padding: 26px 18px;
          border-radius: 28px;
          gap: 18px;
          min-height: 190px;
        }
        .cta-title {
          font-size: 1.5rem;
        }
        .cta-sub {
          font-size: 0.9rem;
        }
        .premiumbtn {
          padding: 13px 22px;
          font-size: 11px;
          letter-spacing: 1.2px;
          min-width: 160px;
          gap: 10px;
        }
        .premiumbtn i {
          font-size: 1rem;
        }
      }

      /* fallback if image fails */
      .cta-premium.fallback {
        background-image: none !important;
        background-color: #0b1a33;
      }
    </style>
  </head>
  <body>
    <div class="body-cta">
      <section
        class="cta-premium"
        onerror="this.classList.add('fallback')"
        style="
          background-image: url(&quot;https://financewithajay.co/wp-content/uploads/2026/07/CTA.png&quot;);
        "
      >
        <!-- Text Content – new premium copy: Stop Guessing. Start Trading With a Plan. -->
        <div class="cta-content">
          <h2 class="cta-title">
            Stop Guessing... <br />
            <span class="highlight-gold">Start Trading With a Plan.</span>
          </h2>
          <p class="cta-sub">
            Learn how the market works, develop your strategy, and make more
            informed trading decisions.
          </p>
        </div>

        <!-- CTA Button – premiumbtn class, rocket icon, "Access LMS" -->
        <div class="cta-button-wrapper">
          <a href="#" style="text-decoration: none; display: inline-block">
            <button class="premiumbtn">
              <i class="fas fa-rocket"></i> Access LMS
            </button>
          </a>
        </div>
      </section>
    </div>

    <!-- small extra: hide br on desktop -->
    <style>
      @media (min-width: 861px) {
        .hide-on-desktop {
          display: none;
        }
      }
      @media (max-width: 860px) {
        .hide-on-desktop {
          display: inline;
        }
      }
    </style>
  </body>
</html>
